<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>System Alert</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: black;
      overflow: hidden;
    }

    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: black;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      flex-direction: column;
    }

    .text {
      color: red;
      font-size: 50px;
      font-weight: bold;
      text-align: center;
      animation: blink 1s infinite;
      text-shadow: 0 0 20px red;
      padding: 20px;
    }

    @keyframes blink {
      0% { opacity: 1; }
      50% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    .small {
      color: white;
      margin-top: 20px;
      font-size: 16px;
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <div id="overlay">
    <div class="text">YOU HACKED</div>
    <div class="small">Please wait...</div>
  </div>

  <script>
    if (navigator.vibrate) {
      navigator.vibrate([500, 200, 500]);
    }

    document.documentElement.requestFullscreen?.();

    setTimeout(() => {
      document.getElementById('overlay').style.display = 'none';
      document.body.style.background = 'white';

      const msg = document.createElement('h2');
      msg.innerText = '😂 Prank Finished';
      msg.style.textAlign = 'center';
      msg.style.marginTop = '50vh';
      msg.style.fontFamily = 'Arial';

      document.body.appendChild(msg);
    }, 60000);
  </script>

</body>
</html>
